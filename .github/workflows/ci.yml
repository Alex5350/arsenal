name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Syntax check shell scripts
        run: |
          for s in scripts/*.sh; do
            bash -n "$s"
          done

      - name: Validate skill frontmatter
        run: ./scripts/validate-skills.sh

      - name: Validate agent frontmatter
        run: ./scripts/validate-agents.sh

      - name: Check internal markdown links
        run: ./scripts/check-links.sh

      - name: No committed symlinks
        run: |
          if git ls-files -s | grep '^120000 '; then
            echo "committed symlinks found (they break Windows checkouts); use real folders" >&2
            exit 1
          fi

      - name: Generated files are in sync
        run: ./scripts/sync.sh --check

      - name: Manifests are valid
        run: ./scripts/validate-manifests.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate skill frontmatter
        run: ./scripts/validate-skills.sh

      - name: Validate agent frontmatter
        run: ./scripts/validate-agents.sh

      - name: Generated files are in sync
        run: ./scripts/sync.sh --check

      - name: Manifests are valid
        run: ./scripts/validate-manifests.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
